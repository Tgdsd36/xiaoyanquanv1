name: xiaoyanquan
description: "小颜圈 - 图片/视频素材库"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 网络
  dio: ^5.7.0

  # 状态管理
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # 路由
  go_router: ^14.8.1

  # 本地存储
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # 图片
  cached_network_image: ^3.4.1

  # 视频
  video_player: ^2.9.2
  chewie: ^1.8.5

  # 瀑布流
  flutter_staggered_grid_view: ^0.7.0

  # 刷新加载
  pull_to_refresh_flutter3: ^2.0.2

  # 图片选择
  image_picker: ^1.1.2

  # 分享
  share_plus: ^10.1.4

  # SVG图标
  flutter_svg: ^2.0.17

  # 工具
  intl: ^0.19.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  json_serializable: ^6.9.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.2

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
