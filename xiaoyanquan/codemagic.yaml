workflows:
  android-release:
    name: Android Release
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      groups:
        - android_signing  # 在 Codemagic 后台配置此分组
      vars:
        API_BASE_URL: "https://xyqapi.cfqfwl.cn/api/v1"
        SHARE_BASE_URL: "https://xyqapi.cfqfwl.cn/share"
    scripts:
      - name: Set up key.properties
        script: |
          echo "storePassword=$CM_KEYSTORE_PASSWORD" > "$CM_BUILD_DIR/android/key.properties"
          echo "keyPassword=$CM_KEY_PASSWORD" >> "$CM_BUILD_DIR/android/key.properties"
          echo "keyAlias=$CM_KEY_ALIAS" >> "$CM_BUILD_DIR/android/key.properties"
          echo "storeFile=$CM_KEYSTORE_PATH" >> "$CM_BUILD_DIR/android/key.properties"
      - name: Flutter packages
        script: flutter packages pub get
      - name: Build APK
        script: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=$API_BASE_URL \
            --dart-define=SHARE_BASE_URL=$SHARE_BASE_URL
    artifacts:
      - build/**/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - your-email@example.com  # 改成你的邮箱
        notify:
          success: true
          failure: true
