workflows:
  ios_adhoc:
    name: iOS AdHoc (Flutter)
    max_build_duration: 120
    environment:
      flutter: stable
      xcode: 16.3
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: app.upon286163.kele
      vars:
        FLUTTER_PROJECT_DIR: xiaoyanquan
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - /Users/builder/Library/Caches/CocoaPods
    scripts:
      - name: Install dependencies
        script: |
          cd "$FLUTTER_PROJECT_DIR"
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd "$FLUTTER_PROJECT_DIR/ios"
          export LANG=en_US.UTF-8
          export LC_ALL=en_US.UTF-8
          rm -rf Pods
          pod install
          test -f "Pods/Target Support Files/Pods-Runner/Pods-Runner-frameworks-Release-input-files.xcfilelist"
          test -f "Pods/Target Support Files/Pods-Runner/Pods-Runner-resources-Release-input-files.xcfilelist"
      - name: Apply provisioning profiles to Xcode project
        script: |
          cd "$FLUTTER_PROJECT_DIR/ios"
          xcode-project use-profiles
      - name: Build IPA (ad-hoc)
        script: |
          cd "$FLUTTER_PROJECT_DIR/ios"
          xcode-project build-ipa \
            --workspace Runner.xcworkspace \
            --scheme Runner
    artifacts:
      - xiaoyanquan/build/ios/ipa/*.ipa
      - xiaoyanquan/build/ios/archive/*.xcarchive
      - xiaoyanquan/ios/build/ios/ipa/*.ipa
      - xiaoyanquan/ios/build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log

  android_release:
    name: Android Release (Flutter)
    max_build_duration: 120
    environment:
      flutter: stable
      vars:
        FLUTTER_PROJECT_DIR: xiaoyanquan
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - /Users/builder/.gradle/caches
    scripts:
      - name: Install dependencies
        script: |
          cd "$FLUTTER_PROJECT_DIR"
          flutter pub get
      - name: Build APK
        script: |
          cd "$FLUTTER_PROJECT_DIR"
          flutter build apk --release
      - name: Build AAB
        script: |
          cd "$FLUTTER_PROJECT_DIR"
          flutter build appbundle --release
    artifacts:
      - xiaoyanquan/build/app/outputs/flutter-apk/*.apk
      - xiaoyanquan/build/app/outputs/bundle/release/*.aab
