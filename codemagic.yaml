workflows:
  ios_adhoc:
    name: iOS AdHoc (Flutter)
    max_build_duration: 120
    environment:
      flutter: stable
      xcode: 16.3
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: app.storm954.quinoa167
      vars:
        FLUTTER_PROJECT_DIR: xiaoyanquan
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - /Users/builder/Library/Caches/CocoaPods
    scripts:
      - name: Install dependencies
        script: |
          cd "$FLUTTER_PROJECT_DIR"
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd "$FLUTTER_PROJECT_DIR/ios"
          export LANG=en_US.UTF-8
          export LC_ALL=en_US.UTF-8
          rm -rf Pods
          pod install
          test -f "Pods/Target Support Files/Pods-Runner/Pods-Runner-frameworks-Release-input-files.xcfilelist"
          test -f "Pods/Target Support Files/Pods-Runner/Pods-Runner-resources-Release-input-files.xcfilelist"
      - name: Apply provisioning profiles to Xcode project
        script: |
          cd "$FLUTTER_PROJECT_DIR/ios"
          xcode-project use-profiles
      - name: Build IPA (ad-hoc)
        script: |
          cd "$FLUTTER_PROJECT_DIR/ios"
          set -e
          security find-identity -v -p codesigning
          ARCHIVE_PATH="$PWD/build/ios/archive/Runner.xcarchive"
          EXPORT_PATH="$PWD/build/ios/ipa"
          rm -rf "$ARCHIVE_PATH" "$EXPORT_PATH"
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            archive \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEVELOPMENT_TEAM=XC7G4T565G \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="00008140-000261CE0C52801C4A3L7M"
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist ExportOptionsAdHoc.plist
    artifacts:
      - xiaoyanquan/build/ios/ipa/*.ipa
      - xiaoyanquan/build/ios/archive/*.xcarchive
      - xiaoyanquan/ios/build/ios/ipa/*.ipa
      - xiaoyanquan/ios/build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log

  android_release:
    name: Android Release (Flutter)
    max_build_duration: 120
    environment:
      flutter: stable
      vars:
        FLUTTER_PROJECT_DIR: xiaoyanquan
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - /Users/builder/.gradle/caches
    scripts:
      - name: Install dependencies
        script: |
          cd "$FLUTTER_PROJECT_DIR"
          flutter pub get
      - name: Build APK
        script: |
          cd "$FLUTTER_PROJECT_DIR"
          flutter build apk --release
      - name: Build AAB
        script: |
          cd "$FLUTTER_PROJECT_DIR"
          flutter build appbundle --release
    artifacts:
      - xiaoyanquan/build/app/outputs/flutter-apk/*.apk
      - xiaoyanquan/build/app/outputs/bundle/release/*.aab
